<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nova Safra · Área do Semeador</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08090A">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#08090A;--bg2:#0E0F11;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--fg:#F5F5F3;--mut:#9A9A95;--mut2:#6B6B67;--g:#22E07A;--g2:#16C566;--gbg:rgba(34,224,122,.12);--f-sans:"Geist",system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,monospace;--f-serif:"Cormorant",Georgia,serif;--side:248px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(ellipse 60% 40% at 70% -5%,rgba(34,224,122,.07),transparent 70%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/56px 56px,var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.mono{font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;color:var(--mut)}
.serif{font-family:var(--f-serif);font-style:italic;font-weight:500}
.logo{display:block;color:var(--g);filter:drop-shadow(0 0 10px rgba(34,224,122,.45))}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:rgba(8,9,10,.82);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 26px}
.brand b{font-weight:800;letter-spacing:-.03em;font-size:19px}
.brand .serif{font-size:21px;margin-right:4px}
.nav-g{margin:14px 10px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;text-decoration:none;color:#c9c9c4;font-weight:500;font-size:15px;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.nav a.on{background:var(--gbg);color:var(--g)}
.nav svg{width:18px;height:18px;flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:#1b1d20;border:1px solid var(--line2);color:#ddd}
.me .nm{font-size:14px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .lv{font-size:12px;color:var(--g)}
.me button{margin-left:auto;color:var(--mut);padding:6px;border-radius:8px}
.me button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
main{padding:40px 48px 80px;max-width:1180px;width:100%}
.demo{display:flex;gap:10px;align-items:center;border:1px dashed rgba(34,224,122,.4);background:rgba(34,224,122,.06);color:#bdf5d4;border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:26px}

/* ---------- type ---------- */
h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
h2 .ic{color:var(--g);width:20px;height:20px}
.sub{color:var(--mut);font-size:14.5px;margin-top:4px}
.sec{margin-top:40px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.link{color:var(--g);font-size:14px;text-decoration:none;font-weight:500}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat b small{font-size:15px;color:var(--mut);font-weight:500}
.stat span{font-size:13px;color:var(--mut)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g));border-radius:99px;box-shadow:0 0 12px rgba(34,224,122,.6)}

/* ---------- habits ---------- */
.habits{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.hb{position:relative;text-align:left;border:1px solid var(--line2);background:rgba(255,255,255,.03);border-radius:16px;padding:16px 14px 14px;transition:transform .12s,border-color .15s,background .15s;min-height:132px;display:flex;flex-direction:column}
.hb:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)}
.hb:disabled{cursor:default;transform:none;opacity:.55}
.hb .em{font-size:24px;line-height:1}
.hb .t{font-weight:700;font-size:16px;margin-top:12px}
.hb .d{font-size:12.5px;color:var(--mut);line-height:1.35;margin-top:3px}
.hb .ck{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .15s}
.hb.on{border-color:rgba(34,224,122,.65);background:linear-gradient(180deg,rgba(34,224,122,.16),rgba(34,224,122,.05))}
.hb.on .ck{background:var(--g);border-color:var(--g);color:#04140A;box-shadow:0 0 12px rgba(34,224,122,.7)}
.hb.on .ck::after{content:"✓";font-weight:800;font-size:13px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.daysw{display:flex;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);padding:4px;border-radius:99px}
.daysw button{padding:7px 14px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--mut)}
.daysw button.on{background:var(--fg);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:99px;padding:6px 12px;font-size:13px;color:#d6d6d1}
.pill.g{border-color:rgba(34,224,122,.45);color:var(--g);background:var(--gbg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 6px 1px rgba(34,224,122,.9)}
.closed{margin-top:16px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:linear-gradient(90deg,rgba(34,224,122,.18),rgba(34,224,122,.04));border:1px solid rgba(34,224,122,.4);font-weight:600}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal .wd{font-family:var(--f-mono);font-size:10.5px;color:var(--mut2);text-align:center;letter-spacing:.1em}
.cal .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.04);border:1px solid transparent;position:relative}
.cal .c.fut{opacity:.35}
.cal .c.today{border-color:var(--fg);color:var(--fg)}
.cal .c[data-n="1"]{background:rgba(34,224,122,.14);color:#cdf7de}
.cal .c[data-n="2"]{background:rgba(34,224,122,.26);color:#e5fbee}
.cal .c[data-n="3"]{background:rgba(34,224,122,.42);color:#fff}
.cal .c[data-n="4"]{background:rgba(34,224,122,.62);color:#04140A}
.cal .c[data-n="5"]{background:var(--g);color:#04140A;box-shadow:0 0 10px rgba(34,224,122,.55)}
.legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);margin-top:14px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}

/* turma / ranking */
.turma{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stack{display:flex}
.stack .av{width:32px;height:32px;margin-left:-8px;border:2px solid var(--bg)}
.stack .av:first-child{margin-left:0}
.rank{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:40px 40px 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.row.me-row{border-color:rgba(34,224,122,.5);background:rgba(34,224,122,.07)}
.row .pos{font-family:var(--f-mono);font-weight:500;color:var(--mut);font-size:14px}
.row .pos.top{color:var(--g)}
.row .n{font-weight:600}
.row .n small{display:block;font-weight:400;color:var(--mut);font-size:12.5px}
.row .s{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.row .s b{color:var(--fg);font-size:16px}
.mini5{display:flex;gap:3px}
.mini5 i{width:7px;height:16px;border-radius:3px;background:rgba(255,255,255,.1)}
.mini5 i.on{background:var(--g);box-shadow:0 0 6px rgba(34,224,122,.6)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.pod{text-align:center;padding:22px 14px}
.pod .av{width:56px;height:56px;font-size:18px;margin:0 auto 10px}
.pod .medal{font-family:var(--f-mono);font-size:12px;display:inline-block;padding:3px 10px;border-radius:99px;margin-bottom:12px;background:rgba(255,255,255,.08)}
.pod.p1 .medal{background:var(--g);color:#04140A}
.pod b{display:block}
.pod span{font-size:13px;color:var(--mut)}

/* calls */
.calls{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.call{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.call:hover{transform:translateY(-3px);border-color:var(--line2)}
.thumb{position:relative;aspect-ratio:16/9;background:#111 center/cover;display:grid;place-items:center;overflow:hidden}
.thumb .num{position:absolute;left:12px;bottom:-14px;font:800 74px/1 var(--f-sans);letter-spacing:-.05em;color:rgba(255,255,255,.12)}
.thumb .play{width:48px;height:48px;border-radius:50%;background:rgba(8,9,10,.6);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;backdrop-filter:blur(4px)}
.thumb .soon{position:absolute;top:10px;right:10px}
.thumb.empty{background:radial-gradient(ellipse at 70% 30%,rgba(34,224,122,.18),transparent 60%),#0d0f10}
.call .info{padding:14px 16px 16px}
.call .ti{font-weight:600;font-size:15px;line-height:1.3}
.call .mt{font-size:12.5px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between}

/* benefícios */
.ben{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ben .card{display:flex;flex-direction:column;gap:10px}
.ben .tag{align-self:flex-start}
.ben h3{font-size:19px;letter-spacing:-.02em}
.ben p{color:var(--mut);font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:99px;font-weight:600;font-size:15px;text-decoration:none;background:linear-gradient(180deg,#3BF08E,#16C566);color:#04140A;box-shadow:0 0 0 1px rgba(34,224,122,.4),0 8px 28px -8px rgba(34,224,122,.6);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ben .btn{margin-top:auto;align-self:flex-start}

.grupo{display:flex;align-items:center;gap:14px;margin-top:22px;text-decoration:none;border-color:rgba(34,224,122,.4);background:linear-gradient(90deg,rgba(34,224,122,.12),rgba(34,224,122,.03))}
.grupo .gi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gbg);color:var(--g);flex:none}
.grupo .gt{flex:1;min-width:0}
.grupo .gt b{display:block;font-size:16px}
.grupo .gt small{display:block;color:var(--mut);font-size:13.5px}
.grupo .btn{flex:none;padding:11px 18px;font-size:14px}
@media (max-width:760px){.grupo{flex-wrap:wrap}.grupo .btn{width:100%}}
/* pacto */
.pacto{width:min(720px,100%);margin:0 auto}
.pacto-full{min-height:100vh;padding:40px 20px 60px}
.pacto .head{text-align:center;margin-bottom:28px}
.pacto .head .logo{margin:0 auto 16px}
.pacto .head h1 .serif{color:var(--g);font-size:1.1em}
.pacto .head p{color:var(--mut);font-size:15px;margin-top:10px;line-height:1.55}
.pacto form{display:flex;flex-direction:column;gap:14px}
.pk{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:18px}
.pk .em{font-size:26px;line-height:1;padding-top:2px}
.pk .nm{font-weight:700;font-size:17px}
.pk label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 6px}
.pk .inp{padding:13px 14px;font-size:15.5px}
.pk .inp.sm{font-size:14.5px;padding:11px 14px}
.pacto .btn{margin-top:8px;padding:16px;font-size:16px}
.pacto .note{text-align:center;font-size:13px;color:var(--mut2);margin-top:10px}
.hb .d.mine{color:#d9d9d4;font-weight:500;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){.pacto-full{padding:26px 16px 50px}.pk{grid-template-columns:30px 1fr;gap:4px 10px;padding:16px}.pk .em{font-size:22px}}
/* título */
.titulo{margin-top:18px;display:flex;align-items:center;gap:18px}
.titulo .tic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--gbg);border:1px solid rgba(34,224,122,.4);color:var(--g);font:700 15px var(--f-mono)}
.titulo .tb{flex:1;min-width:0}
.titulo .tn{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.titulo .tn .serif{font-size:23px;color:var(--g)}
.titulo .tx{font-size:13.5px;color:var(--mut);margin-top:2px}
.titulo .bar{margin-top:10px}
.trail{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.trail span{font-size:11.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut2)}
.trail span.done{color:var(--g);border-color:rgba(34,224,122,.35)}
.trail span.cur{color:#04140A;background:var(--g);border-color:var(--g);font-weight:600}
.lvup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);padding:20px;animation:fin .25s ease}
.lvup .box{width:min(380px,100%);text-align:center;padding:34px 24px;border-radius:22px;background:radial-gradient(ellipse at 50% 0%,rgba(34,224,122,.22),transparent 70%),var(--bg2);border:1px solid rgba(34,224,122,.45)}
.lvup .mono{color:var(--g)}
.lvup h3{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:10px 0 6px}
.lvup p{color:var(--mut);font-size:14.5px;margin-bottom:22px}
@keyframes fin{from{opacity:0}to{opacity:1}}
@media (max-width:760px){.titulo{gap:14px}.titulo .tic{width:44px;height:44px;font-size:13px}.titulo .tn{font-size:18px}.titulo .tn .serif{font-size:20px}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{width:min(960px,100%)}
.modal .vid{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line2)}
.modal iframe{width:100%;height:100%;border:0}
.modal .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.modal .x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);font-size:18px;flex:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .box{width:min(420px,100%);text-align:center}
.login .logo{margin:0 auto}
.login h1{font-size:44px;margin:22px 0 6px;display:flex;justify-content:center;gap:12px;align-items:baseline}
.login h1 .serif{font-size:52px;font-weight:500}
.login h1 b{font-weight:800;letter-spacing:-.04em}
.login form{margin-top:30px;display:flex;flex-direction:column;gap:12px;text-align:left}
.login label{font-size:13px;color:var(--mut)}
.inp{width:100%;padding:15px 16px;border-radius:13px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--fg);font:inherit;font-size:16px;outline:none}
.inp:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(34,224,122,.18)}
.login .btn{width:100%;padding:16px;margin-top:4px}
.msg{font-size:14px;color:var(--mut);margin-top:14px;min-height:22px}
.msg.ok{color:var(--g)}.msg.err{color:#ff8a8a}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .25s;background:var(--fg);color:var(--bg);font-weight:600;padding:12px 18px;border-radius:99px;font-size:14px;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media (max-width:960px){
  .habits{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:22px 16px 110px}
  h1{font-size:27px}
  .habits{grid-template-columns:1fr 1fr}
  .hb{min-height:118px}
  .grid3{grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stat b{font-size:23px}
  .card{padding:16px;border-radius:16px}
  .row{grid-template-columns:30px 34px 1fr auto;gap:10px;padding:10px 12px}
  .row .mini5{display:none}
  .row .av{width:34px;height:34px}
  .podium{gap:8px}.pod{padding:16px 6px}.pod .av{width:44px;height:44px}
  .mtop{display:flex!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,9,10,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);text-decoration:none;padding:4px 0}
  .tabbar a svg{width:21px;height:21px}
  .tabbar a.on{color:var(--g)}
}
.mtop{display:none;align-items:center;justify-content:space-between;margin-bottom:20px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(() => {
const C = window.SAFRA_CONFIG;
const DEMO = !C.SUPABASE_URL;
const sb = DEMO ? null : window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- datas (fuso de São Paulo) ---------- */
const fmt = new Intl.DateTimeFormat("en-CA", {timeZone:"America/Sao_Paulo"});
const TODAY = fmt.format(new Date());
const addDays = (d, n) => { const t = new Date(d + "T12:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0,10); };
const YESTERDAY = addDays(TODAY, -1);
const DAYS = []; for (let d = C.INICIO; d <= C.FIM; d = addDays(d, 1)) DAYS.push(d);
const dayIdx = d => DAYS.indexOf(d) + 1;
const curDay = Math.min(Math.max(dayIdx(TODAY) || (TODAY < C.INICIO ? 0 : DAYS.length), 0), DAYS.length);
const br = d => { const [y,m,dd] = d.split("-"); return `${dd}/${m}`; };
const inRange = d => d >= C.INICIO && d <= C.FIM;

// turma de exemplo (só no modo demonstração)
function demoTurma(){
  const names=["Lucas Andrade","Marina Costa","Rafael Lima","Bia Fernandes","Pedro Henrique","Ana Clara","João Vitor","Camila Rocha","Gabriel Souza","Larissa Melo","Thiago Alves","Júlia Martins","Felipe Ramos","Duda Nogueira"];
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  return names.map((name,i)=>{
    const disc=.95-i*.045; const checks=new Set();
    for(const d of DAYS){ if(d>TODAY) break; if(d===TODAY && rnd()>.6) continue;
      for(const h of HABITS) if(rnd()<disc) checks.add(d+"|"+h.k); }
    return {id:"demo"+i,name,checks};
  });
}

const DB = {
  async session(){
    if (DEMO) { const n = LS.get("safra_demo_user"); return n ? {id:"me", name:n, email:"demo@novasafra"} : null; }
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) return null;
    const u = session.user;
    const { data:p } = await sb.from("profiles").select("name").eq("id", u.id).maybeSingle();
    return { id:u.id, email:u.email, name:p?.name || "" };
  },
  async isMember(){
    if (DEMO) return true;
    const { data, error } = await sb.rpc("is_member");
    return !error && data === true;
  },
  async login(email){
    if (DEMO) return { demo:true };
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
    if (error) throw error;
    return {};
  },
  async logout(){ if (DEMO) { localStorage.removeItem("safra_demo_user"); return; } await sb.auth.signOut(); },
  async saveName(me, name){
    if (DEMO) { LS.set("safra_demo_user", name); return; }
    const { error } = await sb.from("profiles").upsert({ id:me.id, name });
    if (error) throw error;
  },
  async myChecks(me){
    if (DEMO) return new Set(LS.get("safra_demo_checks", []));
    const { data, error } = await sb.from("habit_checks").select("day,habit").eq("user_id", me.id);
    if (error) throw error;
    return new Set(data.map(r => r.day + "|" + r.habit));
  },
  async toggle(me, day, habit, on){
    if (DEMO) { const s = new Set(LS.get("safra_demo_checks", [])); const k=day+"|"+habit; on ? s.add(k) : s.delete(k); LS.set("safra_demo_checks", [...s]); return; }
    const q = on ? sb.from("habit_checks").insert({ user_id:me.id, day, habit })
                 : sb.from("habit_checks").delete().match({ user_id:me.id, day, habit });
    const { error } = await q; if (error && error.code !== "23505") throw error;
  },
  async pact(me){
    if (DEMO) return LS.get("safra_demo_pact", {});
    const { data, error } = await sb.from("pacts").select("habit,activity,goal").eq("user_id", me.id);
    if (error) throw error;
    const o = {}; data.forEach(r => o[r.habit] = { activity:r.activity, goal:r.goal||"" }); return o;
  },
  async savePact(me, pact){
    if (DEMO) { LS.set("safra_demo_pact", pact); return; }
    const rows = HABITS.map(h => ({ user_id:me.id, habit:h.k, activity:pact[h.k].activity, goal:pact[h.k].goal || null }));
    const { error } = await sb.from("pacts").upsert(rows, { onConflict:"user_id,habit" });
    if (error) throw error;
  },
  // ranking: [{id,name,total,today,streak}]
  async ranking(me, myChecks){
    if (DEMO) {
      const rows = demoTurma().map(p => ({ id:p.id, name:p.name, ...score(p.checks) }));
      rows.push({ id:"me", name:me.name, ...score(myChecks) });

    return data.map(r => ({ id:r.user_id, name:r.name || "Semeador", total:r.total, today:r.today, streak:r.streak }));

    ];

    if (error) throw error;
    return data.map((c,i) => ({ n:i+1, ...c }));
  }
};

function score(checks){
  let total=0, today=0; const perDay={};
  for (const k of checks){ const [d,h]=k.split("|"); if(!inRange(d)) continue; total++; perDay[d]=(perDay[d]||0)+1; if(d===TODAY) today++; }
  // sequência: dias seguidos com pelo menos 1 hábito, contando até hoje (ou até ontem, se hoje ainda está aberto)
  let streak=0, d = perDay[TODAY] ? TODAY : YESTERDAY;
  while (perDay[d] && inRange(d)) { streak++; d = addDays(d,-1); }
  return { total, today, streak, perDay };
}

  return `<div class="habits">${HABITS.map(h=>{const on=S.checks.has(day+"|"+h.k);return `<button class="hb ${on?"on":""}" data-hb="${h.k}" data-day="${day}" ${editable?"":"disabled"} aria-pressed="${on}"><span class="ck"></span><span class="em">${h.em}</span><span class="t">${h.t}</span><span class="d ${S.pact[h.k]?.activity?"mine":""}">${esc(S.pact[h.k]?.activity || h.d)}</span></button>`}).join("")}</div>

function titleCard(pts){
  const i = titleIdx(pts), t = TITLES[i], nx = TITLES[i+1];
  const pct = nx ? ((pts-t.min)/(nx.min-t.min)*100) : 100;
  const falta = nx ? nx.min-pts : 0;
  return `<div class="card titulo-card" style="margin-top:22px">
    <div class="titulo" style="margin-top:0"><span class="tic">${String(i+1).padStart(2,"0")}</span>
      <div class="tb"><div class="mono" style="font-size:10.5px">Seu título</div><div class="tn">${t.n}</div>
      <div class="tx">${nx ? `Faltam <b style="color:var(--fg)">${falta} ${falta===1?"ponto":"pontos"}</b> para <b style="color:var(--g)">${nx.n}</b>` : "Título máximo da Safra. Você chegou."}</div>
      <div class="bar"><i style="width:${Math.min(100,pct).toFixed(1)}%"></i></div></div></div>
    <div class="trail">${TITLES.map((x,k)=>`<span class="${k<i?"done":k===i?"cur":""}">${x.n}</span>`).join("")}</div>
  </div>`;
}

    <div class="info"><div class="ti">${esc(c.title)}</div><div class="mt"><span>${esc(c.presenter||"Nova Safra")}</span><span>${br(c.call_date)}</span></div></div></button>`;
}
function pactForm(first){
  return `<form id="pactForm">
    ${HABITS.map(h=>{const p=S.pact[h.k]||{}, ex=PACT_EX[h.k];return `<div class="card pk">
      <span class="em">${h.em}</span>
      <div><div class="nm">${h.t}</div>
      <label for="pa_${h.k}">Meu hábito diário</label>
      <input class="inp" id="pa_${h.k}" name="a_${h.k}" required minlength="2" maxlength="140" value="${esc(p.activity||"")}" placeholder="Ex.: ${esc(ex[0])}">
      <label for="pg_${h.k}">Resultado que quero até 31/12 <span style="color:var(--mut2)">(opcional)</span></label>
      <input class="inp sm" id="pg_${h.k}" name="g_${h.k}" maxlength="200" value="${esc(p.goal||"")}" placeholder="Ex.: ${esc(ex[1])}"></div>
    </div>`}).join("")}
    <button class="btn" type="submit">${first?"Firmar meu pacto":"Salvar meu pacto"}</button>
    <p class="note">${first?"Você pode ajustar depois em “Meu Pacto”.":"Mudou de fase? Ajuste o hábito, mas seu pacto do primeiro dia fica guardado."}</p>
  </form>`;
}
function pactHead(first){
  return `<div class="head">${first?logo(52):""}
    <div class="mono">${first?"Antes de começar":"Meu Pacto da Safra"}</div>
    <h1 style="margin-top:10px">${first?`Seu <span class="serif">Pacto</span> da Safra`:"Seus 5 hábitos"}</h1>
    <p>Escolha <b style="color:var(--fg)">uma atividade-chave por área</b> que você vai fazer <b style="color:var(--fg)">todo dia até 31/12</b> para terminar 2026 com um resultado totalmente diferente. É o seu desafio, do seu jeito.</p></div>`;
}
function pagePactoFull(){ return `<div class="pacto-full"><div class="pacto">${pactHead(true)}${pactForm(true)}</div></div>`; }
function pagePacto(){ return shell(`<div class="pacto" style="margin:0">${pactHead(false)}${pactForm(false)}</div>`); }
function pageCalls(){
  return shell(`<h1>Calls da Safra</h1><p class="sub">Toda semana ao vivo. A gravação fica aqui para quem não conseguiu ir.</p>
  <section class="sec calls">${S.calls.map(c=>callCard(c)).join("")}</section>`);
}

function rowHTML(r,i){
  const mine = r.id===S.me.id || r.id==="me";
  return `<div class="row ${mine?"me-row":""}"><span class="pos ${i<3?"top":""}">#${i+1}</span>${avatar(r.name)}<span class="n">${esc(r.name)}${mine?" (você)":""}<small><span style="color:var(--g)">${titleOf(r.total)}</span> · ${seguidos(r.streak)}</small></span><span class="mini5">${[0,1,2,3,4].map(k=>`<i class="${k<r.today?"on":""}"></i>`).join("")}</span><span class="s"><b>${r.total}</b> pts</span></div>`;
}
function pageSemeadores(){
  const top = S.rank.slice(0,3); const order=[1,0,2];
  return shell(`<h1>Semeadores</h1><p class="sub">Cada hábito marcado vale 1 ponto. Os pontos sobem seu título: ${TITLES.map(t=>t.n+" ("+t.min+")").join(" → ")}.</p>
  <section class="sec">
    ${top.length>=3?`<div class="podium">${order.map(i=>{const r=top[i];return `<div class="card pod p${i+1}"><span class="medal">#${i+1}</span>${avatar(r.name)}<b>${esc(first(r.name))}</b><span style="display:block;color:var(--g);font-size:12.5px">${titleOf(r.total)}</span><span>${r.total} pts · ${r.streak}d</span></div>`}).join("")}</div>`:""}
    <div class="rank">${S.rank.map((r,i)=>rowHTML(r,i)).join("")}</div>
  </section>`);
}

function pageBeneficios(){
  return shell(`<h1>Benefícios</h1><p class="sub">O que vem junto com a sua vaga na turma.</p>
  <section class="sec ben">
    <div class="card"><span class="pill g tag">Bônus</span><h3>Skill de Motion</h3><p>A skill para criar motions com IA. Baixe e siga o passo a passo de instalação.</p>
      <a class="btn" ${C.SKILL_URL?`href="${esc(C.SKILL_URL)}" target="_blank" rel="noopener"`:`aria-disabled="true"`}>${C.SKILL_URL?"Baixar a skill":"Liberada em breve"}</a></div>
    <div class="card"><span class="pill tag">Comunidade</span><h3>Grupo da turma</h3><p>Onde a turma conversa, troca network e avisa das calls ao vivo.</p>
      <a class="btn ghost" href="${esc(C.WHATSAPP)}" target="_blank" rel="noopener">Entrar no grupo</a></div>
    <div class="card"><span class="pill tag">Toda semana</span><h3>Call da Safra ao vivo</h3><p>4 calls ao vivo durante os 45 dias, com gravação aqui na área.</p>
      <a class="btn ghost" href="#/calls">Ver as calls</a></div>
  </section>`);
}

function pageLogin(state={}){
  return `<div class="login"><div class="box">
    ${logo(64)}
    <h1><span class="serif">Nova</span><b>Safra</b></h1>
    <p class="sub">Área do Semeador</p>
    ${state.needName ? `
    <form id="nameForm"><label for="nm">Como a turma vai te chamar?</label><input class="inp" id="nm" required maxlength="40" placeholder="Seu nome" autocomplete="name"><button class="btn" type="submit">Entrar na turma</button></form>`
    : DEMO ? `
    <form id="nameForm"><label for="nm">Seu nome (modo demonstração)</label><input class="inp" id="nm" required maxlength="40" placeholder="Seu nome" autocomplete="name"><button class="btn" type="submit">Ver a área</button></form>`
    : `
    <form id="loginForm"><label for="em">E-mail usado na compra</label><input class="inp" id="em" type="email" required placeholder="voce@email.com" autocomplete="email"><button class="btn" type="submit">Receber link de acesso</button></form>`}
    <p class="msg ${state.cls||""}" id="msg">${esc(state.msg||"")}</p>
  </div></div>`;
}

/* ---------- render ---------- */
const PAGES = { pacto:pagePacto, inicio:pageInicio, fechamento:pageFechamento, calls:pageCalls, semeadores:pageSemeadores, beneficios:pageBeneficios };
function sortRank(){ S.rank.sort((a,b)=>b.total-a.total||b.streak-a.streak||a.name.localeCompare(b.name)); }
function render(){
  if (!S.me) return;
  if (!pactDone()) { $("#root").innerHTML = pagePactoFull(); window.scrollTo({top:0}); return; }
  const p = PAGES[route()] || pageInicio;
  $("#root").innerHTML = p();
  window.scrollTo({top:0});
}
function refreshMine(){ // atualiza a linha do próprio usuário no ranking sem ir ao servidor
  const mine = S.rank.find(r=>r.id===S.me.id||r.id==="me");
  if (mine) Object.assign(mine, score(S.checks)); sortRank();
}

document.addEventListener("click", async e => {
  const hb = e.target.closest("[data-hb]");
  if (hb && !hb.disabled) {
    const day = hb.dataset.day, h = hb.dataset.hb, k = day+"|"+h, on = !S.checks.has(k);
    const lvBefore = titleIdx(score(S.checks).total);
    on ? S.checks.add(k) : S.checks.delete(k); refreshMine();
    const y = window.scrollY; $("#root").innerHTML = (PAGES[route()]||pageInicio)(); window.scrollTo(0,y);
    const lvAfter = titleIdx(score(S.checks).total);
    if (on && lvAfter > lvBefore) showLevelUp(lvAfter);
    else if (on && HABITS.every(x=>S.checks.has(day+"|"+x.k))) toast("Dia fechado. 5 de 5 🌱");
    try { await DB.toggle(S.me, day, h, on); }
    catch(err){ on ? S.checks.delete(k) : S.checks.add(k); refreshMine(); render(); toast("Não salvou. Tenta de novo."); console.error(err); }
    return;
  }
  const ds = e.target.closest("[data-day-sel]");
  if (ds) { S.editDay = ds.dataset.daySel; const y=window.scrollY; $("#root").innerHTML = pageFechamento(); window.scrollTo(0,y); return; }
  const cl = e.target.closest("[data-call]");
  if (cl) { openVideo(cl.dataset.call, cl.dataset.title); return; }
  const act = e.target.closest("[data-act]");
  if (act?.dataset.act === "logout") { await DB.logout(); location.hash=""; location.reload(); }
  if (e.target.closest("[data-close-lv]") || e.target.classList.contains("lvup")) document.querySelector(".lvup")?.remove();
  if (e.target.closest("[data-close]") || e.target.classList.contains("modal")) document.querySelector(".modal")?.remove();
});
document.addEventListener("keydown", e => { if (e.key==="Escape") { document.querySelector(".modal")?.remove(); document.querySelector(".lvup")?.remove(); } });

function openVideo(id, title){
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="box"><div class="top"><b>${esc(title)}</b><button class="x" data-close aria-label="Fechar">✕</button></div><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div></div>`;
  document.body.appendChild(m);
}

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginForm") {
    const email = $("#em").value.trim().toLowerCase(); const b = e.target.querySelector("button"); b.disabled = true;
    try { await DB.login(email); $("#msg").className="msg ok"; $("#msg").textContent = "Pronto! Abra o link que mandamos para "+email+"."; }
    catch(err){ $("#msg").className="msg err"; $("#msg").textContent = "Não deu para enviar. Confira o e-mail e tente de novo."; b.disabled=false; console.error(err); }
  }
  if (e.target.id === "pactForm") {
    const f = new FormData(e.target), wasDone = pactDone(), pact = {};
    for (const h of HABITS) pact[h.k] = { activity:String(f.get("a_"+h.k)||"").trim(), goal:String(f.get("g_"+h.k)||"").trim() };
    if (HABITS.some(h => pact[h.k].activity.length < 2)) { toast("Preencha um hábito para cada área."); return; }
    const b = e.target.querySelector("button[type=submit]"); b.disabled = true;
    try { await DB.savePact(S.me, pact); S.pact = pact; }
    catch(err){ b.disabled = false; toast("Não salvou. Tenta de novo."); console.error(err); return; }
    toast(wasDone ? "Pacto atualizado 🌱" : "Pacto firmado 🌱");
    if (route() === "inicio") render(); else location.hash = "#/inicio";
    return;
  }
  if (e.target.id === "nameForm") {
    const name = $("#nm").value.trim(); if (!name) return;
    const me = S.me || { id:"me" };
    try { await DB.saveName(me, name); } catch(err){ $("#msg").className="msg err"; $("#msg").textContent="Não salvou o nome. Tenta de novo."; return; }
    boot();
  }
});

async function load(){
  [S.checks, S.calls, S.pact] = await Promise.all([DB.myChecks(S.me), DB.calls(), DB.pact(S.me)]);
  S.rank = await DB.ranking(S.me, S.checks); sortRank();
}

async function boot(){
  try {
    const me = await DB.session();
    if (!me) { $("#root").innerHTML = pageLogin(); return; }
    if (!(await DB.isMember())) { await sb.auth.signOut(); $("#root").innerHTML = pageLogin({msg:"Esse e-mail ainda não está na turma. Use o mesmo e-mail da compra ou fale com a gente no grupo.", cls:"err"}); return; }
    S.me = me;
    if (!me.name) { $("#root").innerHTML = pageLogin({needName:true}); return; }
    await load(); render();
  } catch(err){ console.error(err); $("#root").innerHTML = pageLogin({msg:"Algo deu errado ao carregar. Recarregue a página.", cls:"err"}); }
}

window.addEventListener("hashchange", render);
if (!DEMO) sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !S.me) boot(); });
boot();
})();
</script>
</body>
</html>
